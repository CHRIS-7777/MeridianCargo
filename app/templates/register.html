{{define "content"}}
<div class="authbox">
  <h2>Create your portal account</h2>
  <div id="reg-msg"></div>
  <form id="register-form">
    <div class="form-group"><label>Company</label><input type="text" id="r-company" class="form-control" required></div>
    <div class="form-group"><label>Your name</label><input type="text" id="r-name" class="form-control" required></div>
    <div class="form-group"><label>Work e-mail</label><input type="email" id="r-email" class="form-control" required></div>
    <div class="form-group"><label>Username</label><input type="text" id="r-user" class="form-control" required></div>
    <div class="form-group"><label>Password</label><input type="password" id="r-pass" class="form-control" required></div>
    <button class="btn btn-primary btn-block" type="submit">Create account</button>
  </form>
  <p class="top-gap">Already registered? <a href="/login">Sign in</a></p>
</div>
{{end}}
