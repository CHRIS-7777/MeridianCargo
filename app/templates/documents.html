{{define "content"}}
<h2>Documents</h2>
<table class="table table-striped"><thead><tr><th>Title</th><th>File</th><th>Added</th><th></th></tr></thead><tbody>
{{range .Docs}}<tr><td>{{.Title}}</td><td><code>{{.File}}</code></td><td>{{.Uploaded}}</td>
<td>{{if eq .Source "upload"}}<a href="/uploads/{{.File}}" target="_blank">Open</a>{{else}}<a href="/documents/download?name={{.File}}">Download</a>{{end}}</td></tr>
{{else}}<tr><td colspan="4" class="muted">No documents on file.</td></tr>{{end}}
</tbody></table>
<h4 class="top-gap">Upload a supporting document</h4>
<p class="muted">Accepted formats: PDF, JPG, PNG (max 8 MB).</p>
<form method="post" action="/documents/upload" enctype="multipart/form-data" id="upload-form">
  <div class="form-group"><label>Title</label><input type="text" name="title" class="form-control"></div>
  <div class="form-group"><label>File</label><input type="file" name="document" id="doc-file" class="form-control" accept=".pdf,.jpg,.jpeg,.png"></div>
  <button class="btn btn-primary" type="submit">Upload</button>
</form>
{{end}}
