{{define "content"}}
{{raw "<!-- TODO MC-1182: remove staging dispatcher account (dispatch.temp / Temp#2024) before go-live -->"}}
<div class="authbox">
  <h2>Sign in</h2>
  {{if .Error}}<div class="alert alert-danger">{{.Error}}</div>{{end}}
  {{if .Notice}}<div class="alert alert-success">{{.Notice}}</div>{{end}}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{.Next}}">
    <div class="form-group"><label>Username</label><input type="text" name="username" class="form-control" autocomplete="username" required></div>
    <div class="form-group"><label>Password</label><input type="password" name="password" class="form-control" autocomplete="current-password" required></div>
    <button class="btn btn-primary btn-block" type="submit">Sign in</button>
  </form>
  <p class="top-gap"><a href="/forgot">Forgot password?</a> &middot; <a href="/register">Create an account</a></p>
</div>
{{end}}
