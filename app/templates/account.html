{{define "content"}}
<h2>My account</h2>
{{if .Notice}}<div class="alert alert-success">Your contact details were updated.</div>{{end}}
<div class="row">
  <div class="col-md-6">
    <div class="panel panel-default"><div class="panel-body">
      <div class="k">Name</div><div class="v">{{.FullName}}</div>
      <div class="k top-gap">Company</div><div class="v">{{.Company}}</div>
    </div></div>
    <h4>Contact details</h4>
    <form method="post" action="/account/contact">
      <div class="form-group"><label>E-mail</label><input type="email" name="email" class="form-control" value="{{.Email}}"></div>
      <div class="form-group"><label>Phone</label><input type="text" name="phone" class="form-control" value="{{.Phone}}"></div>
      <button class="btn btn-primary" type="submit">Save changes</button>
    </form>
  </div>
</div>
{{end}}
